<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LemariKuu - My Wardrobe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>
    <script>

if(!sessionStorage.getItem("isLoggedIn")){

    window.location.href =
    "login.html";

}

function logout(){

    sessionStorage.removeItem(
        "isLoggedIn"
    );

    window.location.href =
    "login.html";

}

</script>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            Lemari<span>Kuu</span>
        </div>

        <ul class="menu">

       <li>
    <a href="index.html">
        <i class="fa-solid fa-shirt"></i>
        My Wardrobe
    </a>
</li>

<li>
    <a href="outfit-generator.html">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        Outfit Generator
    </a>
</li>

<li>
    <a href="maps.html">
        <i class="fa-solid fa-map-location-dot"></i>
        Donate Clothes
    </a>
</li>

<li class="active">
    <a href="profile.html">
        <i class="fa-solid fa-user"></i>
        Profile
    </a>
</li>

<li>
    <a href="#" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Exit
    </a>
</li>

        </ul>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
     <div class="topbar">

            <h5 class="mb-0">
                Personal Information
            </h5>

        </div>

    <div class="content-area">

    <div class="content-card">
    <div class="page-header">
    </div>

    <section class="profile-banner">

        <div class="profile-avatar">
        <i class="fa-solid fa-user"></i>
        </div>

        <div class="profile-details">

        <h2 id="profileName"></h2>
        <p id="profileEmail"></p>

        <button class="edit-profile-btn">
            <i class="fa-solid fa-pen"></i>
            Edit Profile
        </button>

        </div>

    </section>

    <section class="profile-overview">

        <div class="overview-card">
            <span>Wardrobe Items</span>
            <h3>24</h3>
        </div>

        <div class="overview-card">
            <span>Outfits Created</span>
            <h3>8</h3>
        </div>

        <div class="overview-card">
            <span>Favorites</span>
            <h3>5</h3>
        </div>

        <div class="overview-card">
            <span>Member Since</span>
            <h3>2026</h3>
        </div>

    </section>

    <section class="account-card">

        <h3>Account Information</h3>

        <div class="account-row">
            <span>Username</span>
            <strong id="accountUsername"></strong>
        </div>

        <div class="account-row">
            <span>Email</span>
            <strong id="accountEmail"></strong>
        </div>

        <div class="account-row">
            <span>Member Since</span>
            <strong>June 2026</strong>
        </div>

    </section>

</main>

</div>

<script>
    const username = sessionStorage.getItem("username") || "Guest";
    const email = sessionStorage.getItem("email") || "Tidak ada email";

    const nameEl = document.getElementById("profileName");
    const emailEl = document.getElementById("profileEmail");
    const accUserEl = document.getElementById("accountUsername");
    const accEmailEl = document.getElementById("accountEmail");

    if (nameEl) nameEl.textContent = username;
    if (emailEl) emailEl.textContent = email;
    if (accUserEl) accUserEl.textContent = username;
    if (accEmailEl) accEmailEl.textContent = email;
</script>

</body>
</html>
