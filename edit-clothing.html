<script>
const urlParams = new URLSearchParams(window.location.search);
const clothingNameURL = urlParams.get('name');

let currentItemData = null;
let currentIndex = -1;

if (clothingNameURL) {

    const data =
        JSON.parse(localStorage.getItem("wardrobe")) || [];

    const cleanURLName =
        clothingNameURL.replace(/\s+/g, '').toLowerCase();

    currentIndex = data.findIndex(clothing => {

        const cleanJSONName =
            clothing.name.replace(/\s+/g, '').toLowerCase();

        return cleanJSONName === cleanURLName;

    });

    if (currentIndex !== -1) {

        currentItemData = data[currentIndex];

        populateForm(currentItemData);

    } else {

        console.error(
            "Clothes Not Found"
        );

    }

}

function populateForm(item) {

    document.getElementById("preview").src = item.image;
    document.getElementById("clothesName").value = item.name;
    document.getElementById("clothesCategory").value = item.category;

    document.querySelectorAll(".style-checkbox").forEach(cb => {
        cb.checked = item.style.includes(cb.value);
    });

    document.querySelectorAll(".color-checkbox").forEach(cb => {
        cb.checked = item.color.includes(cb.value);
    });

}

function previewImage(event){
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById("preview").src = reader.result;
    }
    if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function saveChanges(){

    const wardrobe =
        JSON.parse(localStorage.getItem("wardrobe")) || [];

    if(currentIndex === -1){

        alert("Item not found");
        return;

    }

    const selectedStyles =
    Array.from(
        document.querySelectorAll(".style-checkbox:checked")
    ).map(cb => cb.value);

    const selectedColors =
    Array.from(
        document.querySelectorAll(".color-checkbox:checked")
    ).map(cb => cb.value);

    wardrobe[currentIndex].name =
        document.getElementById(
            "clothesName"
        ).value;

    wardrobe[currentIndex].category =
        document.getElementById(
            "clothesCategory"
        ).value;

    wardrobe[currentIndex].image =
        document.getElementById(
            "preview"
        ).src;

    wardrobe[currentIndex].style =
        selectedStyles;

    wardrobe[currentIndex].color =
        selectedColors;

    localStorage.setItem(
        "wardrobe",
        JSON.stringify(wardrobe)
    );

    alert("Changes saved successfully!");

    window.location.href =
        "index.html";
}
</script>
