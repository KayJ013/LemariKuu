<script>
const urlParams = new URLSearchParams(window.location.search);
const clothingNameURL = urlParams.get('name');

let currentItemData = null;

if (clothingNameURL) {
    fetch('json_clothing.php')
        .then(response => response.json())
        .then(data => {
            // Kita bersihkan spasi di URL untuk dicocokkan (misal "blue shirt" atau "blueshirt" jadi "blueshirt")
            const cleanURLName = clothingNameURL.replace(/\s+/g, '').toLowerCase();

            const item = data.find(clothing => {
                const cleanJSONName = clothing.name.replace(/\s+/g, '').toLowerCase();
                return cleanJSONName === cleanURLName;
            });
            
            if (item) {
                currentItemData = item;
                populateForm(item);
            } else {
                console.error("Data pakaian tidak ditemukan untuk nama: " + clothingNameURL);
            }
        })
        .catch(error => console.error("Gagal mengambil data pakaian:", error));
}

function populateForm(item) {
    document.getElementById("preview").src = item.image;
    document.getElementById("clothesName").value = item.name;
    document.getElementById("clothesCategory").value = item.category.toLowerCase();

    const styleCheckboxes = document.querySelectorAll('.col-lg-2 .form-check-input');
    styleCheckboxes.forEach(cb => {
        const labelText = cb.nextElementSibling.textContent.trim().toLowerCase();
        const itemStyle = item.style.toLowerCase();
        
        cb.checked = itemStyle.includes(labelText) || labelText.includes(itemStyle);
    });

    const colorCheckboxes = document.querySelectorAll('.col-lg-3 .form-check-input');
    colorCheckboxes.forEach(cb => {
        const labelText = cb.nextElementSibling.textContent.trim().toLowerCase();
        const itemColor = item.color.toLowerCase();

        if (labelText.includes('warm') && itemColor.includes('warm')) cb.checked = true;
        else if (labelText.includes('cool') && itemColor.includes('cool')) cb.checked = true;
        else if (labelText.includes('earth') && itemColor.includes('earth')) cb.checked = true;
        else if (labelText.includes('neutral') && itemColor.includes('neutral')) cb.checked = true;
        else if (labelText.includes('pastel') && itemColor.includes('pastel')) cb.checked = true;
        else if (labelText.includes('metallic') && itemColor.includes('metallic')) cb.checked = true;
        else cb.checked = false;
    });
}

function previewImage(event){
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById("preview").src = reader.result;
    }
    if(event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function saveChanges(){
    alert("Changes saved successfully for: " + clothingNameURL);
    window.location.href = "index.html";
}
