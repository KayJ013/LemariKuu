<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LemariKuu - My Wardrobe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            Lemari<span>Kuu</span>
        </div>

        <ul class="menu">

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-shirt"></i>
                    My Wardrobe
                </a>
            </li>

            <li>
                <a href="outfit-generator.html">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Outfit Generator
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Exit
                </a>
            </li>

        </ul>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HEADER -->
        <div class="topbar">

            <h5 class="mb-0">
                Hi User, ready to style your day?
            </h5>

        </div>

        <!-- CONTENT -->
        <div class="content-area">

            <div class="content-card">

                <h4 class="mb-4">
                    My Wardrobe
                </h4>

                <!-- CATEGORY FILTER -->

                <div class="category-filter mb-4">

                    <button class="category-btn active"
                            data-category="all">
                        All
                    </button>

                    <button class="category-btn"
                            data-category="tops">
                        Tops
                    </button>

                    <button class="category-btn"
                            data-category="bottoms">
                        Bottoms
                    </button>

                    <button class="category-btn"
                            data-category="outerwears">
                        Outerwears
                    </button>

                    <button class="category-btn"
                            data-category="accessories">
                        Accessories
                    </button>

                </div>

                <!-- FILTERS -->

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                    <button class="btn btn-shuffle"
                            id="shuffleBtn">

                        <i class="fa-solid fa-shuffle"></i>
                        Shuffle

                    </button>

                    <div class="d-flex gap-2">

                        <select id="colorFilter"
                                class="form-select custom-select">

                            <option value="all">
                                Color
                            </option>

                            <option value="warm">
                                Warm Tones
                            </option>

                            <option value="cool">
                                Cool Tones
                            </option>

                            <option value="earth">
                                Earth Tones
                            </option>

                            <option value="neutral">
                                Neutrals
                            </option>

                        </select>

                        <select id="styleFilter"
                                class="form-select custom-select">

                            <option value="all">
                                Style
                            </option>

                            <option value="casual">
                                Casual
                            </option>

                            <option value="formal">
                                Formal
                            </option>

                            <option value="business">
                                Business
                            </option>

                            <option value="streetwear">
                                Streetwear
                            </option>

                            <option value="sporty">
                                Sporty
                            </option>

                            <option value="vintage">
                                Vintage
                            </option>

                        </select>

                    </div>

                </div>

                <!-- GALLERY -->

                <div class="row g-4"
                     id="wardrobeContainer">

                    <!-- ITEM 1 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                        data-category="tops"
                        data-color="warm"
                        data-style="casual">

                        <div class="wardrobe-card">

                            <img src="images/top1.jpg"
                                class="img-fluid">

                            <p>Orange T-Shirt</p>

                            <div class="card-actions">

                                <a href="edit-clothing.html"
                                class="edit-btn">

                                    <i class="fa-solid fa-pen"></i>

                                </a>

                            </div>

                        </div>

                    </div>

                    <!-- ITEM 2 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="bottoms"
                         data-color="neutral"
                         data-style="sporty">

                        <div class="wardrobe-card">

                            <img src="images/pants1.jpg"
                                 class="img-fluid">

                            <p>Black Pants</p>

                        </div>

                    </div>

                    <!-- ITEM 3 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="outerwears"
                         data-color="earth"
                         data-style="streetwear">

                        <div class="wardrobe-card">

                            <img src="images/hoodie1.jpg"
                                 class="img-fluid">

                            <p>Brown Hoodie</p>

                        </div>

                    </div>

                    <!-- ITEM 4 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="tops"
                         data-color="cool"
                         data-style="formal">

                        <div class="wardrobe-card">

                            <img src="images/shirt1.jpg"
                                 class="img-fluid">

                            <p>Blue Shirt</p>

                        </div>

                    </div>

                    <!-- ITEM 5 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="accessories"
                         data-color="neutral"
                         data-style="formal">

                        <div class="wardrobe-card">

                            <img src="images/watch1.jpg"
                                 class="img-fluid">

                            <p>Silver Watch</p>

                        </div>

                    </div>

                    <!-- ITEM 6 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="accessories"
                         data-color="warm"
                         data-style="vintage">

                        <div class="wardrobe-card">

                            <img src="images/necklace1.jpg"
                                 class="img-fluid">

                            <p>Gold Necklace</p>

                        </div>

                    </div>

                    <!-- ITEM 7 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="bottoms"
                         data-color="earth"
                         data-style="casual">

                        <div class="wardrobe-card">

                            <img src="images/shorts1.jpg"
                                 class="img-fluid">

                            <p>Khaki Shorts</p>

                        </div>

                    </div>

                    <!-- ITEM 8 -->

                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="outerwears"
                         data-color="cool"
                         data-style="business">

                        <div class="wardrobe-card">

                            <img src="images/blazer1.jpg"
                                 class="img-fluid">

                            <p>Navy Blazer</p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<!-- FLOATING BUTTON -->

<a href="add-clothing.html"
   class="fab">

    <i class="fa-solid fa-plus"></i>

</a>

<script>

let selectedCategory = "all";

const categoryButtons =
document.querySelectorAll(".category-btn");

const colorFilter =
document.getElementById("colorFilter");

const styleFilter =
document.getElementById("styleFilter");

const items =
document.querySelectorAll(".clothing-item");

/* FILTER */

function applyFilters(){

    const selectedColor =
    colorFilter.value;

    const selectedStyle =
    styleFilter.value;

    items.forEach(item => {

        const category =
        item.dataset.category;

        const color =
        item.dataset.color;

        const style =
        item.dataset.style;

        const categoryMatch =
        selectedCategory === "all" ||
        category === selectedCategory;

        const colorMatch =
        selectedColor === "all" ||
        color === selectedColor;

        const styleMatch =
        selectedStyle === "all" ||
        style === selectedStyle;

        item.style.display =
        categoryMatch &&
        colorMatch &&
        styleMatch
        ? "block"
        : "none";

    });

}

/* CATEGORY */

categoryButtons.forEach(button => {

    button.addEventListener("click", () => {

        categoryButtons.forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        selectedCategory =
        button.dataset.category;

        applyFilters();

    });

});

/* COLOR */

colorFilter.addEventListener(
"change",
applyFilters
);

/* STYLE */

styleFilter.addEventListener(
"change",
applyFilters
);

/* SHUFFLE */

document
.getElementById("shuffleBtn")
.addEventListener("click", () => {

    const container =
    document.getElementById(
        "wardrobeContainer"
    );

    const cards =
    Array.from(container.children);

    cards.sort(() =>
        Math.random() - 0.5
    );

    cards.forEach(card =>
        container.appendChild(card)
    );

});

</script>

</body>
</html>
