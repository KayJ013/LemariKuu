<li>

    <!-- MAIN CONTENT -->

</div>

<!-- FLOATING BUTTON -->
<a href="add-clothing.html"
   class="fab">

    <i class="fa-solid fa-plus"></i>

</a>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const today = new Date();
    document.getElementById("currentDay").textContent = today.toLocaleDateString("en-US", { weekday: "long" });
    document.getElementById("currentDate").textContent = today.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

    let selectedCategory = "all";
    const categoryButtons = document.querySelectorAll(".category-btn");
    const colorFilter = document.getElementById("colorFilter");
    const styleFilter = document.getElementById("styleFilter");
    const container = document.getElementById("wardrobeContainer"); 

    if (!localStorage.getItem("wardrobe")) {

        fetch("clothing.json")
            .then(res => res.json())
            .then(data => {

                localStorage.setItem(
                    "wardrobe",
                    JSON.stringify(data)
                );

                location.reload();

            });

        return;
    }

    const data =
    JSON.parse(localStorage.getItem("wardrobe")) || [];

            container.innerHTML = ""; 

            data.forEach(item => {
                    console.log("Nama:", item.name);
                    console.log("Style:", item.style);
                    console.log("Color:", item.color);
                const editAction = item.has_edit ? `
                <div class="card-actions">
                    <a href="edit-clothing.html?name=${encodeURIComponent(item.name)}" class="edit-btn">
                        <i class="fa-solid fa-pen"></i>
                    </a>

                    <button
                        class="delete-btn"
                        onclick="deleteClothing('${item.name}')">

                        <i class="fa-solid fa-trash-can"></i>

                    </button>
                </div>
            ` : '';

                const cardHTML = `
                        <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="${item.category}"
                         data-style='${JSON.stringify(item.style)}'
                         data-color='${JSON.stringify(item.color)}'>
                        <div class="wardrobe-card">
                            <img src="${item.image}" class="img-fluid">
                            <p>${item.name}</p>
                            ${editAction}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            initFilterEvents();

    // FILTER LOGIC
    function applyFilters(){
        const items = document.querySelectorAll(".clothing-item");
        const selectedColor = colorFilter.value;
        const selectedStyle = styleFilter.value;

        items.forEach(item => {

            const category = item.dataset.category;
            const styles = JSON.parse(item.dataset.style || "[]");
            const colors = JSON.parse(item.dataset.color || "[]");

            const categoryMatch =
                selectedCategory === "all" || category === selectedCategory;

            const styleMatch =
                selectedStyle === "all" || styles.includes(selectedStyle);

            const colorMatch =
                selectedColor === "all" || colors.includes(selectedColor);

            item.style.display =
                categoryMatch && colorMatch && styleMatch
                    ? "block"
                    : "none";
        });
    }

    // EVENT LISTENER FILTER
    function initFilterEvents() {
        categoryButtons.forEach(button => {
            button.addEventListener("click", () => {
                categoryButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");
                selectedCategory = button.dataset.category;
                applyFilters();
            });
        });

        colorFilter.addEventListener("change", applyFilters);
        styleFilter.addEventListener("change", applyFilters);
    }

    // SHUFFLE
    document.getElementById("shuffleBtn").addEventListener("click", () => {
        const items = document.querySelectorAll(".clothing-item");
        items.forEach(item => {
            item.classList.remove('shuffle-animation');
            void item.offsetWidth; 
            item.classList.add('shuffle-animation');
        });

        const cards = Array.from(container.children);
        cards.sort(() => Math.random() - 0.5);
        cards.forEach(card => container.appendChild(card));
    });
});

    //Delete
    function deleteClothing(name){
        if(!confirm("Delete this clothing item?")){
            return;
        }

        let wardrobe;

        try {
            wardrobe = JSON.parse(localStorage.getItem("wardrobe"));
        } catch (e) {
            wardrobe = null;
        }

        if (!Array.isArray(wardrobe) || wardrobe.length === 0) {
            fetch("clothing.json")
                .then(res => res.json())
                .then(data => {
                    localStorage.setItem("wardrobe", JSON.stringify(data));
                    location.reload();
                });
            return;
        }

        const updated = wardrobe.filter(item => item.name !== name);

        localStorage.setItem("wardrobe", JSON.stringify(updated));

        location.reload();
    }
</script>

</body>
</html>
