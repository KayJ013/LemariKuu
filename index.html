<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LemariKuu - My Wardrobe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            Lemari<span>Kuu</span>
        </div>

        <ul class="menu">

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-shirt"></i>
                    My Wardrobe
                </a>
            </li>

            <li>
                <a href="outfit-generator.html">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Outfit Generator
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Exit
                </a>
            </li>

        </ul>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HEADER -->
        <div class="topbar">

            <h5 class="mb-0">
                Hi User, ready to style your day?
            </h5>

        </div>

        <!-- CONTENT -->
        <div class="content-area">

            <!-- WEATHER + STYLE TIP CARD -->

            <div class="weather-style-card mb-4">

                <div class="weather-info">

                    <div class="weather-left">

                        <h5 id="currentDay">
                            Thursday
                        </h5>

                        <p id="currentDate">
                            June 11, 2026
                        </p>

                    </div>

                    <div class="weather-right">

                        <div class="weather-icon">
                            ☀️
                        </div>

                        <div>

                            <h4 class="mb-0">
                                31°C
                            </h4>

                            <small>
                                Sunny
                            </small>

                        </div>

                    </div>

                </div>

                <div class="style-tip">

                    <strong>
                        Today's Style Tip
                    </strong>

                    <p class="mb-0">
                        Light colors work best for warm weather and help keep your outfit feeling fresh throughout the day.
                    </p>

                </div>

            </div>

            <div class="content-card">

                <h4 class="mb-4">
                    My Wardrobe
                </h4>

                <!-- CATEGORY FILTER -->

                <div class="category-filter mb-4">

                    <button class="category-btn active"
                            data-category="all">
                        All
                    </button>

                    <button class="category-btn"
                            data-category="tops">
                        Tops
                    </button>

                    <button class="category-btn"
                            data-category="bottoms">
                        Bottoms
                    </button>

                    <button class="category-btn"
                            data-category="outerwears">
                        Outerwears
                    </button>

                    <button class="category-btn"
                            data-category="accessories">
                        Accessories
                    </button>

                </div>

                <!-- FILTERS -->

                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">

                    <button class="btn btn-shuffle"
                            id="shuffleBtn">

                        <i class="fa-solid fa-shuffle"></i>
                        Shuffle

                    </button>

                    <div class="d-flex gap-2">

                        <select id="colorFilter"
                                class="form-select custom-select">

                            <option value="all">
                                Color
                            </option>

                            <option value="warm">
                                Warm Tones
                            </option>

                            <option value="cool">
                                Cool Tones
                            </option>

                            <option value="earth">
                                Earth Tones
                            </option>

                            <option value="neutral">
                                Neutrals
                            </option>

                        </select>

                        <select id="styleFilter"
                                class="form-select custom-select">

                            <option value="all">
                                Style
                            </option>

                            <option value="casual">
                                Casual
                            </option>

                            <option value="formal">
                                Formal
                            </option>

                            <option value="business">
                                Business
                            </option>

                            <option value="streetwear">
                                Streetwear
                            </option>

                            <option value="sporty">
                                Sporty
                            </option>

                            <option value="vintage">
                                Vintage
                            </option>

                        </select>

                    </div>

                </div>

                <!-- GALLERY -->

                <div class="row g-4"
                     id="wardrobeContainer">

                </div>

            </div>

        </div>

    </main>

</div>

<!-- FLOATING BUTTON -->

<a href="add-clothing.html"
   class="fab">

    <i class="fa-solid fa-plus"></i>

</a>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const today = new Date();
    document.getElementById("currentDay").textContent = today.toLocaleDateString("en-US", { weekday: "long" });
    document.getElementById("currentDate").textContent = today.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

    let selectedCategory = "all";
    const categoryButtons = document.querySelectorAll(".category-btn");
    const colorFilter = document.getElementById("colorFilter");
    const styleFilter = document.getElementById("styleFilter");
    const container = document.getElementById("wardrobeContainer"); 

    // FETCH
    fetch('json_clothing.php')
        .then(response => {
            if (!response.ok) {
                throw new Error('Gagal mengambil data dari server lokal');
            }
            return response.json(); 
        })
        .then(data => {
            container.innerHTML = ""; 

            data.forEach(item => {
                const editAction = item.has_edit ? `
                    <div class="card-actions">
                        <a href="edit-clothing.html?name=${encodeURIComponent(item.name)}" class="edit-btn">
                            <i class="fa-solid fa-pen"></i>
                        </a>
                    </div>
                ` : '';

                const cardHTML = `
                    <div class="col-lg-3 col-md-4 clothing-item"
                         data-category="${item.category}"
                         data-color="${item.color}"
                         data-style="${item.style}">
                        <div class="wardrobe-card">
                            <img src="${item.image}" class="img-fluid">
                            <p>${item.name}</p>
                            ${editAction}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

            initFilterEvents();
        })
        .catch(error => console.error("Eror memuat data:", error));

    // FILTER LOGIC
    function applyFilters(){
        const items = document.querySelectorAll(".clothing-item");
        const selectedColor = colorFilter.value;
        const selectedStyle = styleFilter.value;

        items.forEach(item => {
            const category = item.dataset.category;
            const color = item.dataset.color;
            const style = item.dataset.style;

            const categoryMatch = selectedCategory === "all" || category === selectedCategory;
            const colorMatch = selectedColor === "all" || color === selectedColor;
            const styleMatch = selectedStyle === "all" || style === selectedStyle;

            item.style.display = categoryMatch && colorMatch && styleMatch ? "block" : "none";
        });
    }

    // EVENT LISTENER FILTER
    function initFilterEvents() {
        categoryButtons.forEach(button => {
            button.addEventListener("click", () => {
                categoryButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");
                selectedCategory = button.dataset.category;
                applyFilters();
            });
        });

        colorFilter.addEventListener("change", applyFilters);
        styleFilter.addEventListener("change", applyFilters);
    }

    // SHUFFLE
    document.getElementById("shuffleBtn").addEventListener("click", () => {
        const items = document.querySelectorAll(".clothing-item");
        items.forEach(item => {
            item.classList.remove('shuffle-animation');
            void item.offsetWidth; 
            item.classList.add('shuffle-animation');
        });

        const cards = Array.from(container.children);
        cards.sort(() => Math.random() - 0.5);
        cards.forEach(card => container.appendChild(card));
    });
});
</script>

</body>
</html>
