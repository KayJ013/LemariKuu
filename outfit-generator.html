<script>

// ===========
// DATA OUTFIT 
// ===========
let totalWardrobe = [];
let lastIndex = -1;

// Kombinasi Set
const outfitSets = [
    { style: "Urban Look", top: "Black T-Shirt", bottom: "Black Pants", outer: "Denim Jacket" },
    { style: "Smart Casual", top: "Blue Shirt", bottom: "Blue Jeans", outer: "" },
    { style: "Sporty Style", top: "White T-Shirt", bottom: "Khaki Shorts", outer: "Bomber Jacket" },
    { style: "Casual Streetwear", top: "White T-Shirt", bottom: "Blue Jeans", outer: "Denim Jacket" },
    { style: "Business Casual", top: "White Shirt", bottom: "Black Pants", outer: "Navy Blazer" },
    { style: "Vintage Vibes", top: "White Shirt", bottom: "Khaki Chinos", outer: "Navy Blazer" }
];

// Fetch
fetch('json_clothing.php')
    .then(response => response.json())
    .then(data => {
        totalWardrobe = data; 
        generateOutfit();
    })
    .catch(error => console.error("Gagal memuat data JSON:", error));


// ===============
// GENERATE OUTFIT
// ===============
function generateOutfit(){
    if (totalWardrobe.length === 0) return;

    // ANIMATION
    document.querySelectorAll('.outfit-card').forEach(card => {
        card.classList.remove('shuffle-animation');
        void card.offsetWidth;
        card.classList.add('shuffle-animation');
    });

    createConfetti();

    let randomIndex;
    do {
        randomIndex = Math.floor(Math.random() * outfitSets.length);
    } while (randomIndex === lastIndex);

    lastIndex = randomIndex;

    const selected = outfitSets[randomIndex];

    const topData = totalWardrobe.find(item => item.name.toLowerCase() === selected.top.toLowerCase());
    const bottomData = totalWardrobe.find(item => item.name.toLowerCase() === selected.bottom.toLowerCase());
    const outerData = totalWardrobe.find(item => item.name.toLowerCase() === selected.outer.toLowerCase());

    if (topData) {
        document.getElementById("topImage").src = topData.image;
        document.getElementById("topName").textContent = topData.name;
    }

    if (bottomData) {
        document.getElementById("bottomImage").src = bottomData.image;
        document.getElementById("bottomName").textContent = bottomData.name;
    }

    const outerImgElement = document.getElementById("outerImage");
    const outerNameElement = document.getElementById("outerName");

    if (outerData) {
        outerImgElement.style.visibility = "visible";
        outerImgElement.style.display = "block";
        outerImgElement.src = outerData.image;
        outerNameElement.textContent = outerData.name;
    } else {
        outerImgElement.style.visibility = "hidden"; 
        outerImgElement.style.display = "block";
        outerImgElement.src = ""; 
        
       outerNameElement.innerHTML = '<span class="text-muted small"><i>No Outerwear Needed</i></span>';
    }

    document.getElementById("outfitStyle").textContent = selected.style;
}

// ==========================
// BUTTON
// ==========================

document
.getElementById("generateBtn")
.addEventListener(
    "click",
    generateOutfit
);


// ==========================
// CONFETTI ANIMATION
// ==========================

const canvas =
document.getElementById("confettiCanvas");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

let particles = [];

function createConfetti(){

    particles = [];

    for(let i=0;i<30;i++){

        particles.push({

            x:Math.random()*canvas.width,

            y:-20,

            size:Math.random()*8+4,

            speedY:Math.random()*4+2,

            speedX:(Math.random()-0.5)*4,

            rotation:Math.random()*360

        });

    }

    animateConfetti();

}

function animateConfetti(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.y += p.speedY;
        p.x += p.speedX;

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        ctx.rotate(
            p.rotation * Math.PI / 180
        );

        ctx.fillStyle = `hsl(${Math.random()*360},80%,60%)`;

        ctx.fillRect(
            -p.size/2,
            -p.size/2,
            p.size,
            p.size
        );

        ctx.restore();

    });

    particles =
    particles.filter(
        p => p.y < canvas.height + 50
    );

    if(particles.length > 0){

        requestAnimationFrame(
            animateConfetti
        );

    }

}

</script>
