<script>

function formatStyle(text) {
    if (!text) return "";
    return text
        .split(" ")
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(" ");
}

function getWardrobe() {
    return JSON.parse(localStorage.getItem("wardrobe")) || [];
}

function getRandom(arr) {
    if (!arr || arr.length === 0) return null;
    return arr[Math.floor(Math.random() * arr.length)];
}

function getAllStyles(data) {
    return [...new Set(data.flatMap(item => item.style || []))];
}

function filterItem(data, category, style) {
    return data.filter(item =>
        item.category === category &&
        item.style.includes(style)
    );
}

// ================
// OUTFIT GENERATOR
// ================

function generateOutfit() {

    const wardrobe = getWardrobe();

    if (!wardrobe.length) {
        alert("Wardrobe kosong!");
        return;
    }

    // ANIMATION
    document.querySelectorAll('.outfit-card').forEach(card => {
        card.classList.remove('shuffle-animation');
        void card.offsetWidth;
        card.classList.add('shuffle-animation');
    });

    createConfetti();

    const styles = getAllStyles(wardrobe);

    let selectedStyle = null;
    let tries = 0;

    do {
        const candidate = getRandom(styles);
        tries++;

        const tops = filterItem(wardrobe, "tops", candidate);
        const bottoms = filterItem(wardrobe, "bottoms", candidate);

        if (tops.length > 0 && bottoms.length > 0) {
            selectedStyle = candidate;
            break;
        }

    } while (tries < 30);

    if (!selectedStyle) {
        alert("Tidak ada outfit lengkap (top + bottom) di wardrobe kamu");
        return;
    }

    const tops = filterItem(wardrobe, "tops", selectedStyle);
    const bottoms = filterItem(wardrobe, "bottoms", selectedStyle);
    const outerwears = filterItem(wardrobe, "outerwears", selectedStyle);

    const top = getRandom(tops);
    const bottom = getRandom(bottoms);
    const outer = getRandom(outerwears);

    const topImg = document.getElementById("topImage");
    const bottomImg = document.getElementById("bottomImage");
    const outerImg = document.getElementById("outerImage");

    const topName = document.getElementById("topName");
    const bottomName = document.getElementById("bottomName");
    const outerName = document.getElementById("outerName");

    if (top) {
        topImg.src = top.image;
        topName.textContent = top.name;
    }

    if (bottom) {
        bottomImg.src = bottom.image;
        bottomName.textContent = bottom.name;
    }

    if (outer) {
        outerImg.style.display = "block";
        outerImg.src = outer.image;
        outerName.textContent = outer.name;
    } else {
        outerImg.style.display = "none";
        outerName.innerHTML = '<span class="text-muted small"><i>No Outerwear Needed</i></span>';
    }

    document.getElementById("outfitStyle").textContent =
        formatStyle(selectedStyle);
}

// ========
// CONFETTI
// ========

const canvas = document.getElementById("confettiCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createConfetti() {

    particles = [];

    for (let i = 0; i < 30; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: -20,
            size: Math.random() * 8 + 4,
            speedY: Math.random() * 4 + 2,
            speedX: (Math.random() - 0.5) * 4,
            rotation: Math.random() * 360
        });
    }

    animateConfetti();
}

function animateConfetti() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {

        p.y += p.speedY;
        p.x += p.speedX;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);

        ctx.fillStyle = `hsl(${Math.random() * 360},80%,60%)`;

        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);

        ctx.restore();
    });

    particles = particles.filter(p => p.y < canvas.height + 50);

    if (particles.length > 0) {
        requestAnimationFrame(animateConfetti);
    }
}

// ======
// EVENT
// =====
document.getElementById("generateBtn")
.addEventListener("click", generateOutfit);

window.addEventListener("DOMContentLoaded", () => {
    generateOutfit();
});
</script>
