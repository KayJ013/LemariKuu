<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Outfit Generator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <aside class="sidebar">

        <div class="logo">
            Lemari<span>Kuu</span>
        </div>

        <ul class="menu">

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-shirt"></i>
                    My Wardrobe
                </a>
            </li>

            <li class="active">
                <a href="outfit-generator.html">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    Outfit Generator
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Exit
                </a>
            </li>

        </ul>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <canvas id="confettiCanvas"></canvas>

        <div class="topbar">
            <h5 class="mb-0">
                Outfit Generator
            </h5>
        </div>

        <div class="content-area">

            <div class="content-card">

                <div class="text-center mb-5">
                    <h2 class="fw-bold">
                        Generate Your Outfit
                    </h2>

                    <p class="text-muted">
                        Create outfit inspiration from your wardrobe collection.
                    </p>
                </div>

                <div class="row justify-content-center g-4">

                    <!-- TOP -->
                    <div class="col-lg-3 col-md-4">
                        <div class="card outfit-card shadow-sm">
                            <img id="topImage" src="images/top1.jpg">
                            <div class="card-body text-center">
                                <div class="slot-title">Top</div>
                                <h5 id="topName">White Shirt</h5>
                            </div>
                        </div>
                    </div>

                    <!-- BOTTOM -->
                    <div class="col-lg-3 col-md-4">
                        <div class="card outfit-card shadow-sm">
                            <img id="bottomImage" src="images/bottom1.jpg">
                            <div class="card-body text-center">
                                <div class="slot-title">Bottom</div>
                                <h5 id="bottomName">Black Pants</h5>
                            </div>
                        </div>
                    </div>

                    <!-- OUTER -->
                    <div class="col-lg-3 col-md-4">
                        <div class="card outfit-card shadow-sm">
                            <img id="outerImage" src="images/outer1.jpg">
                            <div class="card-body text-center">
                                <div class="slot-title">Outerwear</div>
                                <h5 id="outerName">Denim Jacket</h5>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="text-center mt-5">

                    <button id="generateBtn"
                            class="btn generate-btn">

                        <i class="fa-solid fa-shuffle me-2"></i>
                        Generate Outfit

                    </button>

                </div>

                <div class="text-center mt-4">

                    <p class="mb-1 text-muted">
                        Recommended Style
                    </p>

                    <div id="outfitStyle">
                        Casual Streetwear
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>
</body>

<script>

// ==========================
// DATA OUTFIT
// ==========================

const tops = [
{
    name:"White Shirt",
    image:"images/top1.jpg"
},
{
    name:"Black T-Shirt",
    image:"images/top2.jpg"
},
{
    name:"Blue Polo",
    image:"images/top3.jpg"
}
];

const bottoms = [
{
    name:"Black Pants",
    image:"images/bottom1.jpg"
},
{
    name:"Blue Jeans",
    image:"images/bottom2.jpg"
},
{
    name:"Khaki Chinos",
    image:"images/bottom3.jpg"
}
];

const outers = [
{
    name:"Denim Jacket",
    image:"images/outer1.jpg"
},
{
    name:"Bomber Jacket",
    image:"images/outer2.jpg"
},
{
    name:"Grey Hoodie",
    image:"images/outer3.jpg"
}
];

const styles = [
    "Casual Streetwear",
    "Business Casual",
    "Smart Casual",
    "Vintage Vibes",
    "Urban Look",
    "Sporty Style"
];

// ==========================
// RANDOM FUNCTION
// ==========================

function randomItem(array){
    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];
}

// ==========================
// GENERATE OUTFIT
// ==========================

function generateOutfit(){

    // ANIMATION
    document.querySelectorAll('.outfit-card')
    .forEach(card=>{

        card.classList.remove('shuffle-animation');

        void card.offsetWidth;

        card.classList.add('shuffle-animation');

    });

    createConfetti();

    const top = randomItem(tops);
    const bottom = randomItem(bottoms);
    const outer = randomItem(outers);
    const style = randomItem(styles);

    document.getElementById("topImage").src = top.image;
    document.getElementById("topName").textContent = top.name;

    document.getElementById("bottomImage").src = bottom.image;
    document.getElementById("bottomName").textContent = bottom.name;

    document.getElementById("outerImage").src = outer.image;
    document.getElementById("outerName").textContent = outer.name;

    document.getElementById("outfitStyle").textContent = style;

}

// ==========================
// BUTTON
// ==========================

document
.getElementById("generateBtn")
.addEventListener(
    "click",
    generateOutfit
);

// ==========================
// AUTO GENERATE SAAT LOAD
// ==========================

window.onload = generateOutfit;


// ==========================
// CONFETTI ANIMATION
// ==========================



const canvas =
document.getElementById("confettiCanvas");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

let particles = [];

function createConfetti(){

    particles = [];

    for(let i=0;i<30;i++){

        particles.push({

            x:Math.random()*canvas.width,

            y:-20,

            size:Math.random()*8+4,

            speedY:Math.random()*4+2,

            speedX:(Math.random()-0.5)*4,

            rotation:Math.random()*360

        });

    }

    animateConfetti();

}

function animateConfetti(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.y += p.speedY;
        p.x += p.speedX;

        ctx.save();

        ctx.translate(
            p.x,
            p.y
        );

        ctx.rotate(
            p.rotation * Math.PI / 180
        );

        const colors = [

            "#22303F", // Yankees Blue
            "#8FBFDA", // Dark Sky Blue
            "#2C6485", // Bdazzled Blue
            "#394A56", // Charcoal
            "#E7E8E7"  // Platinum

        ];

        ctx.fillStyle =
        colors[
            Math.floor(
                Math.random() * colors.length
            )
        ];

        ctx.fillRect(
            -p.size/2,
            -p.size/2,
            p.size,
            p.size
        );

        ctx.restore();

    });

    particles =
    particles.filter(
        p => p.y < canvas.height + 50
    );

    if(particles.length > 0){

        requestAnimationFrame(
            animateConfetti
        );

    }

}

</script>

</html>
